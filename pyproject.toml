[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "purged-cv"
version = "0.1.0.dev0"
description = "Minimal, dependency-light sklearn-compatible purged k-fold cross-validation with an embargo period."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "mvnikolov2009", email = "mvnikolov2009@gmail.com" }]
keywords = ["cross-validation", "time-series", "finance", "scikit-learn", "backtesting"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = ["numpy>=1.23", "scikit-learn>=1.3"]

[project.optional-dependencies]
test = ["pytest>=7", "pytest-cov"]

[project.urls]
Homepage = "https://github.com/mvnikolov2009/purged-cv"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests", "src"]
addopts = "--doctest-modules"

[tool.black]
line-length = 100

[tool.coverage.run]
source = ["purged_cv"]
